<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Own Voice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="top">
    <h1 data-i18n="title">Own Voice</h1>
    <label class="lang"><span data-i18n="lang">Language</span> <select id="langSel"></select></label>
  </div>
  <p class="muted" data-i18n="tagline"></p>
  <nav id="nav">
    <button data-tab="profile" class="on" data-i18n="nav.profile"></button>
    <button data-tab="record" data-i18n="nav.record"></button>
    <button data-tab="match" data-i18n="nav.match"></button>
    <button data-tab="sliders" data-i18n="nav.sliders"></button>
    <button data-tab="result" data-i18n="nav.result"></button>
    <button data-tab="live" data-i18n="nav.live"></button>
    <button data-tab="dual" data-i18n="nav.dual"></button>
  </nav>
</header>

<main>
<section id="profile" class="tab on">
  <h2 data-i18n="profile.h"></h2>
  <p class="muted" data-i18n="profile.note"></p>
  <div class="grid">
    <label><span data-i18n="profile.sex"></span> <select id="pSex"><option value="">—</option><option value="f" data-i18n="sex.f"></option><option value="m" data-i18n="sex.m"></option><option value="x" data-i18n="sex.x"></option></select></label>
    <label><span data-i18n="profile.age"></span> <input id="pAge" type="number" min="8" max="100"></label>
    <label><span data-i18n="profile.lang"></span> <input id="pLang" placeholder="en / uk / ru"></label>
    <label><span data-i18n="profile.phones"></span> <select id="pPhones"><option value="">—</option><option value="over" data-i18n="phones.over"></option><option value="in" data-i18n="phones.in"></option><option value="bone" data-i18n="phones.bone"></option><option value="speaker" data-i18n="phones.speaker"></option></select></label>
    <label><span data-i18n="profile.sing"></span> <select id="pSing"><option value="">—</option><option value="no" data-i18n="sing.no"></option><option value="some" data-i18n="sing.some"></option><option value="pro" data-i18n="sing.pro"></option></select></label>
    <label><span data-i18n="profile.strange"></span> <input id="pStrange" type="range" min="1" max="10" value="5"><span id="pStrangeV">5</span></label>
  </div>
  <label class="check"><input id="pConsent" type="checkbox" checked> <span data-i18n="profile.consent"></span></label>
  <button class="primary" data-go="record" data-i18n="next"></button>
</section>

<section id="record" class="tab">
  <h2 data-i18n="record.h"></h2>
  <ol class="muted small">
    <li data-i18n="record.s1"></li>
    <li><span data-i18n="record.s2"></span> <b data-i18n="phrase"></b></li>
    <li data-i18n="record.s3"></li>
  </ol>
  <div class="row">
    <label class="grow"><span data-i18n="record.micSel"></span> <select id="micAir"><option value="" data-i18n="record.defaultMic"></option></select></label>
    <button id="btnDevices" data-i18n="record.devices"></button>
  </div>
  <details id="twoMic" class="explain">
    <summary><b data-i18n="two.title"></b><span class="muted small" data-i18n="two.short"></span></summary>
    <div class="explain-body small">
      <h3 data-i18n="two.h1"></h3><p data-i18n="two.p1"></p>
      <h3 data-i18n="two.h2"></h3><p data-i18n="two.p2"></p>
      <h3 data-i18n="two.h3"></h3><p data-i18n="two.p3"></p>
      <h3 data-i18n="two.h4"></h3><p data-i18n="two.p4"></p><p data-i18n="two.p4b"></p>
      <h3 data-i18n="two.h5"></h3><p data-i18n="two.p5"></p>
      <h3 data-i18n="two.h6"></h3><p data-i18n="two.p6"></p>
    </div>
    <label class="check"><input type="checkbox" id="useTwo"> <span data-i18n="two.enable"></span></label>
    <div class="row" id="twoRow" hidden>
      <label><span data-i18n="record.mode"></span> <select id="recMode">
        <option value="two" data-i18n="mode.two"></option>
        <option value="stereo" data-i18n="mode.stereo"></option>
      </select></label>
      <label id="boneLbl"><span data-i18n="record.bone"></span> <select id="micBone"></select></label>
    </div>
  </details>
  <div class="row">
    <button id="btnRec" class="primary"></button>
    <button id="btnPlayRaw" disabled data-i18n="record.play"></button>
    <button id="btnDemo" class="ghost" data-i18n="record.demo"></button>
  </div>
  <div class="meter"><div id="meterBar"></div></div>
  <p id="recInfo" class="muted"></p>
  <button class="primary" data-go="match" id="goMatch" disabled data-i18n="record.go"></button>
</section>

<section id="match" class="tab">
  <h2 data-i18n="match.h"></h2>
  <p class="muted" data-i18n="match.note"></p>
  <div id="matchIdle"><button id="btnMatchStart" class="primary"></button></div>
  <div id="matchRun" hidden>
    <div class="progress"><div id="matchBar"></div></div>
    <div id="pairCard" class="pair">
      <div class="pair-head"><b id="pairNo"></b> <span id="matchStage" class="muted small"></span></div>
      <div class="ab">
        <button id="playA" class="big">▶ A</button>
        <button id="playB" class="big">▶ B</button>
      </div>
      <div class="ab">
        <button id="pickA" class="primary" data-i18n="match.pickA"></button>
        <button id="pickSame" data-i18n="match.same"></button>
        <button id="pickB" class="primary" data-i18n="match.pickB"></button>
      </div>
      <p id="matchHint" class="hint"></p>
    </div>
    <p class="muted small"><span data-i18n="match.history"></span></p>
    <div id="history" class="history"></div>
  </div>
  <div id="matchDone" hidden>
    <p data-i18n="match.done"></p>
    <label><span data-i18n="match.similarity"></span> <input id="rateAuto" type="range" min="1" max="10" value="5"><span id="rateAutoV">5</span></label>
    <button id="playAuto" data-i18n="match.playResult"></button>
    <button class="primary" data-go="sliders" data-i18n="match.toSliders"></button>
  </div>
</section>

<section id="sliders" class="tab">
  <h2 data-i18n="sliders.h"></h2>
  <p class="muted" data-i18n="sliders.note"></p>
  <div class="row">
    <button id="btnLoop" class="primary"></button>
    <button id="btnBypass"></button>
    <button id="btnReset" data-i18n="sliders.reset"></button>
  </div>
  <div id="sliderBox"></div>
  <label><span data-i18n="sliders.final"></span> <input id="rateFinal" type="range" min="1" max="10" value="5"><span id="rateFinalV">5</span></label>
  <button class="primary" data-go="result" data-i18n="next"></button>
</section>

<section id="result" class="tab">
  <h2 data-i18n="result.h"></h2>
  <p id="sendInfo"></p>
  <pre id="resultBox"></pre>
  <div class="row">
    <button id="btnJson" class="primary" data-i18n="result.json"></button>
    <button id="btnWav" data-i18n="result.wav"></button>
    <button id="btnSend" data-i18n="result.send"></button>
    <button id="btnNew" class="ghost" data-i18n="result.new"></button>
  </div>
</section>

<section id="live" class="tab">
  <h2 data-i18n="live.h"></h2>
  <p class="muted" data-i18n="live.note"></p>
  <div class="row">
    <button id="btnLive" class="primary"></button>
    <button id="btnLiveBypass" disabled></button>
    <button id="btnLiveRec" disabled></button>
  </div>
  <p id="liveInfo" class="muted"></p>
</section>

<section id="dual" class="tab">
  <h2 data-i18n="dual.h"></h2>
  <p class="muted" data-i18n="dual.note"></p>
  <canvas id="curveCanvas"></canvas>
  <p class="small"><span class="sw air"></span><span data-i18n="dual.air"></span> <span class="sw bone"></span><span data-i18n="dual.bone"></span> <span class="sw ratio"></span><span data-i18n="dual.ratio"></span></p>
  <p id="dualInfo" class="muted"></p>
  <div class="row">
    <button id="btnCurveSave" disabled data-i18n="dual.save"></button>
    <button id="btnCurveClear" class="ghost" data-i18n="dual.clear"></button>
  </div>
</section>
</main>

<footer class="muted small">v<span id="ver"></span> · <span id="sid"></span></footer>
<script type="module" src="app.js"></script>
</body>
</html>
